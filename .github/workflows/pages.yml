name: Pages

# Publishes only site/, which holds the project's two public static pages:
# oauth2.html, the redirect page Safari's tab-based sign-in watches for (see
# src/platform/safari.ts), and privacy.html, the hosted privacy policy the
# Chrome Web Store requires a URL for (see docs/store-readiness.md). Deploying
# that directory rather than the repo root keeps the published surface to
# exactly those files — no source, no docs, no build output.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
